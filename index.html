<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Write and preview Twitter / X threads with accurate character counts. Free, no login, local autosave, and JSON import/export."
    />
    <title>Twedit — Twitter / X Thread Editor</title>
    <link rel="canonical" href="https://twedit.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Twedit" />
    <meta property="og:title" content="Twedit — Twitter / X Thread Editor" />
    <meta
      property="og:description"
      content="Write and preview threads with accurate character counts. Free. No login."
    />
    <meta property="og:url" content="https://twedit.net/" />
    <meta property="og:image" content="https://twedit.net/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Twedit's two-column editor previewing a tweet with a twedit.net link card."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twedit — Twitter / X Thread Editor" />
    <meta
      name="twitter:description"
      content="Write and preview threads with accurate character counts. Free. No login."
    />
    <meta
      name="twitter:image"
      content="https://twedit.net/social-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="Twedit's two-column editor previewing a tweet with a twedit.net link card."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script defer src="app.js"></script>
  </head>
  <body class="bg-white text-heading antialiased">
    <main class="mx-auto max-w-6xl px-5 py-8 sm:px-8 sm:py-12">
      <header class="mb-8 flex items-center justify-between gap-4">
        <h1 class="text-xl font-semibold">Twedit</h1>
        <div class="flex gap-5 text-sm">
          <button
            id="import"
            class="font-medium text-body hover:text-heading hover:underline"
          >
            Import JSON
          </button>
          <button
            id="export"
            class="font-medium text-body hover:text-heading hover:underline"
          >
            Export JSON
          </button>
          <input
            type="file"
            id="import-file"
            accept=".json,application/json"
            hidden
          />
        </div>
      </header>
      <p class="mb-6 text-sm text-body">
        Write and preview Twitter / X threads with accurate character counts. No
        login needed.
      </p>
      <div class="grid grid-cols-1 gap-8 md:grid-cols-2 md:gap-12">
        <section aria-labelledby="input-heading" class="min-w-0">
          <h2 id="input-heading" class="mb-4 text-sm font-medium text-body">
            Input
          </h2>
          <div id="tweet-editors" class="space-y-5"></div>
          <button
            id="add-tweet"
            class="mt-4 inline-flex items-center justify-center rounded-base bg-brand px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-strong focus:outline-none focus:ring-4 focus:ring-brand-medium disabled:cursor-not-allowed disabled:opacity-50"
          >
            + Add tweet
          </button>
        </section>
        <section aria-labelledby="preview-heading" class="min-w-0">
          <h2 id="preview-heading" class="mb-4 text-sm font-medium text-body">
            Preview
          </h2>
          <div
            id="preview"
            class="divide-y divide-default rounded-base border border-default"
          ></div>
        </section>
      </div>
      <p
        id="notice"
        role="status"
        aria-live="polite"
        class="mt-5 text-sm text-body"
        hidden
      ></p>
      <p
        id="storage-warning"
        role="alert"
        class="mt-3 text-sm text-fg-danger"
        hidden
      >
        Local saving is unavailable. Export JSON before closing.
      </p>
    </main>
    <noscript>Enable JavaScript to use the editor.</noscript>
  </body>
</html>
